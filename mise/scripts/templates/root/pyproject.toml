# pyproject.toml template
# Generated by 'mise run kaggle-init ${SLUG}'
# This file defines the project metadata and runtime dependencies.

[project]
name = "${PROJECT_NAME}"
version = "0.1.0"
description = "Kaggle project scaffold for ${SLUG}"
requires-python = ">=${PY_VERSION}"
readme = "README.md"
authors = []

# Core runtime dependencies (installed via `uv sync`)
dependencies = [
  "marimo",
  "polars",
  "numpy",
  "scikit-learn",
  "xgboost",
  "matplotlib",
  "plotly",
  "pyyaml",
  "python-dotenv",
  "rich",
  "tqdm",
  "pyarrow",
  "kaggle",
]
