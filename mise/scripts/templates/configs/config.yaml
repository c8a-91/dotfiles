# Global experiment configuration
# Generated by 'mise run kaggle-init ${SLUG}'
# You can customize defaults per project.

seed: 42

# Task type: "classification" or "regression"
task: classification

# Primary metric to optimize/report
# - classification: "logloss" (default)
# - regression: "rmse" (root mean squared error)
metric: logloss

# Preferred compute device:
# - "auto": try CUDA, then ROCm, else CPU
# - "cpu": force CPU only
# - "cuda": prefer NVIDIA CUDA if available, else CPU
# - "rocm": prefer AMD ROCm if available, else CPU
device: auto

# Common data paths (relative to project root)
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external

# XGBoost default hyperparameters for quick baselines
xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  # Optional:
  # subsample: 0.8
  # colsample_bytree: 0.8
